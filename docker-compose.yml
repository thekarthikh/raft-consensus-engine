services:

  node1:
    build: .
    hostname: node1
    environment:
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true -Draft.dataDir=/app/data
    command: ["node1", "50051", "node1=node1:50051,node2=node2:50051,node3=node3:50051"]
    ports:
      - "50051:50051"
    volumes:
      - node1-data:/app/data
    networks:
      - raft-net

  node2:
    build: .
    hostname: node2
    environment:
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true -Draft.dataDir=/app/data
    command: ["node2", "50051", "node1=node1:50051,node2=node2:50051,node3=node3:50051"]
    ports:
      - "50052:50051"
    volumes:
      - node2-data:/app/data
    networks:
      - raft-net

  node3:
    build: .
    hostname: node3
    environment:
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true -Draft.dataDir=/app/data
    command: ["node3", "50051", "node1=node1:50051,node2=node2:50051,node3=node3:50051"]
    ports:
      - "50053:50051"
    volumes:
      - node3-data:/app/data
    networks:
      - raft-net

networks:
  raft-net:
    driver: bridge

volumes:
  node1-data:
  node2-data:
  node3-data:
